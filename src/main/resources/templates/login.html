<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>登录 - 智慧校园失物招领平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .login-container {
            margin-top: 10%;
        }
        .card {
            max-width: 420px;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container login-container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm border rounded-3">
                    <div class="card-header bg-primary-subtle text-center py-4">
                        <h2 class="text-primary mb-0">智慧校园失物招领</h2>
                        <p class="text-muted">请登录您的账号</p>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/user/login}" method="post">
                            <div th:if="${error}" class="alert alert-danger">
                                [[${error}]]
                            </div>
                            <div th:if="${message}" class="alert alert-success">
                                [[${message}]]
                            </div>
                            <div class="mb-3">
                                <label for="username" class="form-label">用户名</label>
                                <input type="text" class="form-control" id="username" name="username"
                                       th:value="${username}" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">密码</label>
                                <div class="relative" style="position: relative; display: flex; align-items: center;">
                                    <input type="password" class="form-control pl-3 pr-12 py-2 border rounded w-full focus:outline-none focus:ring-2 focus:ring-blue-500" id="password" name="password" required style="padding-right: 2.5rem !important;">
                                    <button type="button" id="togglePassword" class="absolute right-3 text-gray-500 hover:text-blue-500 transition-colors bg-transparent border-0 p-1 z-10" style="outline: none !important; box-shadow: none !important;" aria-label="切换密码可见性">
                                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18px" height="18px" fill="currentColor" class="bi bi-eye-slash">
                                            <path fill-rule="evenodd" d="M15.823 17.235l-1.981-1.98a3.732 3.732 0 01-5.12-5.121L6.508 7.921a15.8 15.8 0 00-3.393 4.069 16.77 16.77 0 002.204 2.955c1.962 2.093 4.197 3.327 6.652 3.327a8.168 8.168 0 003.85-1.037zm2.27-.558a.884.884 0 01.021.022l4.598 4.597a1 1 0 11-1.414 1.414l-4.017-4.016a10.19 10.19 0 01-5.292 1.578c-3.106 0-5.822-1.499-8.128-3.959a18.748 18.748 0 01-2.06-2.645 13.905 13.905 0 01-.723-1.234 1 1 0 01.013-.92 17.8 17.8 0 014-5.01L1.265 2.677A1 1 0 012.68 1.264L7.275 5.86a.998.998 0 01.022.021l3.465 3.465a.384.384 0 01.006.007l3.855 3.854.007.007 3.463 3.463zm-7.856-5.027a1.73 1.73 0 002.09 2.089l-2.09-2.09zm10.26-.259a16.77 16.77 0 00-1.84-2.362c-1.962-2.093-4.197-3.326-6.67-3.326a7.304 7.304 0 00-1.682.192 1 1 0 01-.456-1.948 9.302 9.302 0 012.14-.244c3.106 0 5.821 1.498 8.128 3.958a18.744 18.744 0 012.06 2.645c.351.545.593.975.722 1.234a1 1 0 01-.012.919 17.841 17.841 0 01-2.084 3.077 1 1 0 01-1.53-1.288 15.85 15.85 0 001.589-2.263c-.108-.184-.23-.383-.366-.594z" clip-rule="evenodd"></path>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                            <!-- 在密码输入框后添加验证码部分 -->
                            <div class="mb-3">
                                <label for="captcha" class="form-label">验证码</label>
                                <div class="input-group">
                                    <input type="text" class="form-control" id="captcha" name="captcha" placeholder="请输入验证码" required>
                                    <img id="captchaImage" src="data:image/png;base64," alt="验证码" class="img-fluid ml-2" style="width: 120px; height: 40px; cursor: pointer;">
                                </div>
                            </div>


                            <button type="submit" class="btn btn-primary w-100">登录</button>
                        </form>
                        <div class="mt-3 text-center">
                            <p>没有账号？<a th:href="@{/user/register}">去注册</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- 在页面底部添加JavaScript代码 -->
    <script>
        // 加载验证码
        function loadCaptcha() {
            fetch('/user/captcha')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('captchaImage').src = 'data:image/png;base64,' + data.image;
                });
        }

        // 页面加载时加载验证码
        document.addEventListener('DOMContentLoaded', loadCaptcha);

        // 点击验证码图片刷新
        document.getElementById('captchaImage').addEventListener('click', loadCaptcha);

        // 切换密码显示状态
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const eyeIcon = togglePassword.querySelector('svg');

        togglePassword.addEventListener('click', function() {
            // 切换密码输入框的类型
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            // 切换图标
            if (type === 'text') {
                eyeIcon.classList.remove('bi-eye-slash');
                eyeIcon.classList.add('bi-eye');
            } else {
                eyeIcon.classList.remove('bi-eye');
                eyeIcon.classList.add('bi-eye-slash');
            }
        });
    </script>
</body>
</html>
