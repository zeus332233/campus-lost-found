<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>认领详情</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <style>
        .content-container {
            max-width: 800px;
            margin-top: 30px;
        }
        .detail-card {
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-radius: 12px;
            overflow: hidden;
        }
        .detail-header {
            background-color: #0dcaf0;
            color: white;
            padding: 1.5rem;
        }
        .detail-body {
            padding: 2rem;
        }
        .detail-item {
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #f1f1f1;
        }
        .detail-item:last-child {
            border-bottom: none;
        }
        .label {
            font-weight: bold;
            color: #495057;
            min-width: 120px;
            display: inline-block;
            vertical-align: top;
        }
        .value {
            display: inline-block;
            width: calc(100% - 130px);
        }
    </style>
</head>
<body>
    <div class="container content-container mx-auto">
        <div class="detail-card">
            <div class="detail-header">
                <h1 class="h3 mb-0">认领详情</h1>
            </div>
            <div class="detail-body" th:if="${claim != null}">
                <div class="detail-item">
                    <span class="label">物品标题:</span>
                    <span class="value" th:text="${itemTitle}"></span>  <!-- 修改这里 -->
                </div>
                <div class="detail-item">
                    <span class="label">物品类型:</span>
                    <span class="value">
                        <span class="badge bg-primary" th:if="${claim.itemType == 'FOUND'}">失物招领</span>
                        <span class="badge bg-danger" th:if="${claim.itemType == 'LOST'}">寻物启事</span>
                    </span>
                </div>
                <div class="detail-item">
                    <span class="label">认领人:</span>
                    <span class="value" th:text="${claimantName}"></span>  <!-- 修改这里 -->
                </div>
                <div class="detail-item">
                    <span class="label">认领说明:</span>
                    <p class="value mt-1" th:text="${claim.claimDescription}" style="white-space: pre-line;"></p>
                </div>
                <div class="detail-item">
                    <span class="label">提交时间:</span>
                    <span class="value" th:text="${dateUtils.formatTimestamp(claim.createTime)}"></span>
                </div>
                <div class="detail-item">
                    <span class="label">状态:</span>
                    <span class="value">
                        <span class="badge bg-warning" th:if="${claim.status == 'PENDING'}">待审核</span>
                        <span class="badge bg-success" th:if="${claim.status == 'APPROVED'}">已通过</span>
                        <span class="badge bg-danger" th:if="${claim.status == 'REJECTED'}">已拒绝</span>
                    </span>
                </div>
                <div class="detail-item" th:if="${claim.status != 'PENDING'}">
                    <span class="label">审核人:</span>
                    <span class="value" th:text="${approverName}"></span>  <!-- 修改这里 -->
                </div>
                <div class="detail-item" th:if="${claim.status != 'PENDING'}">
                    <span class="label">审核时间:</span>
                    <span class="value" th:text="${dateUtils.formatTimestamp(claim.approvalTime)}"></span>
                </div>

                <!-- 审核操作按钮 -->
                <div class="detail-item mt-4" th:if="${claim.status == 'PENDING'}">
                    <!-- 同意按钮 - 使用POST表单 -->
                    <form th:action="@{/claims/{id}/approve(id=${claim.id})}" method="post" style="display: inline;">
                        <button type="submit" class="btn btn-success me-2">
                            <i class="bi bi-check-circle"></i> 同意认领
                        </button>
                    </form>
                     
                    <!-- 拒绝按钮 - 触发模态框 -->
                    <button type="button" class="btn btn-danger me-2" data-bs-toggle="modal" data-bs-target="#rejectModal">
                        <i class="bi bi-x-circle"></i> 拒绝认领
                    </button>
                </div>

                <a th:href="@{/notifications}" class="btn btn-secondary mt-4">返回通知列表</a>
            </div>
        </div>
    </div>

    <!-- 拒绝原因模态框 -->
    <div class="modal fade" id="rejectModal" tabindex="-1" aria-labelledby="rejectModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="rejectModalLabel">拒绝认领申请</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form th:action="@{/claims/{id}/reject(id=${claim.id})}" method="post">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="rejectReason" class="form-label">拒绝原因</label>
                            <textarea class="form-control" id="rejectReason" name="reason" rows="3" required></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                        <button type="submit" class="btn btn-danger">确认拒绝</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
