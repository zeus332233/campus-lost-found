<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>编辑寻物启事</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f5f7fb; }
        .content-container { max-width: 800px; margin-top: 30px; }
        .breadcrumb { margin-bottom: 20px; font-size: 0.85rem; }
        .form-card { background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); padding: 32px; }
    </style>
</head>
<body>
<div class="container content-container mx-auto">
    <nav class="breadcrumb">
        <a href="/dashboard" class="text-decoration-none text-muted">首页</a><span class="mx-2">/</span>
        <a th:href="@{/lost-items/{id}(id=${lostItem.id})}" class="text-decoration-none text-muted" th:text="${lostItem.title}">物品</a><span class="mx-2">/</span>
        <span class="fw-bold">编辑</span>
    </nav>

    <div class="form-card">
        <h4 class="mb-4"><i class="bi bi-pencil-square text-danger me-2"></i>编辑寻物启事信息</h4>
        <form th:action="@{/lost-items/{id}/edit(id=${lostItem.id})}" method="post" class="needs-validation" novalidate>
            <div class="mb-3">
                <label class="form-label fw-bold">标题</label>
                <input type="text" name="title" class="form-control" required th:value="${lostItem.title}">
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">描述</label>
                <textarea name="description" class="form-control" rows="4" required th:text="${lostItem.description}"></textarea>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">类别</label>
                    <select name="category" class="form-select" required>
                        <option value="">-- 请选择类别 --</option>
                        <option value="电子设备" th:selected="${lostItem.category == '电子设备'}">电子设备</option>
                        <option value="随身物品" th:selected="${lostItem.category == '随身物品'}">随身物品</option>
                        <option value="证件文件" th:selected="${lostItem.category == '证件文件'}">证件文件</option>
                        <option value="其他" th:selected="${lostItem.category == '其他'}">其他</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">丢失地点</label>
                    <input type="text" name="location" class="form-control" required th:value="${lostItem.location}">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">丢失时间</label>
                <input type="datetime-local" name="lostTime" class="form-control" required
                       th:value="${lostItem.lostTime != null ? #dates.format(new java.util.Date(lostItem.lostTime), 'yyyy-MM-dd\'T\'HH:mm') : ''}">
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">联系电话</label>
                    <input type="tel" name="contactPhone" class="form-control" required th:value="${lostItem.contactPhone}">
                </div>
                <div class="col-md-6 mb-4">
                    <label class="form-label fw-bold">联系邮箱</label>
                    <input type="email" name="contactEmail" class="form-control" required th:value="${lostItem.contactEmail}">
                </div>
            </div>
            <div class="d-flex gap-3 mt-3">
                <button type="submit" class="btn btn-danger btn-lg"><i class="bi bi-check-circle me-2"></i>保存修改</button>
                <a th:href="@{/lost-items/{id}(id=${lostItem.id})}" class="btn btn-outline-secondary btn-lg"><i class="bi bi-arrow-left me-2"></i>取消</a>
            </div>
        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    (function () {
        'use strict';
        var forms = document.querySelectorAll('.needs-validation');
        Array.prototype.slice.call(forms).forEach(function (form) {
            form.addEventListener('submit', function (event) {
                if (!form.checkValidity()) { event.preventDefault(); event.stopPropagation(); }
                form.classList.add('was-validated');
            }, false);
        });
    })();
</script>
</body>
</html>
