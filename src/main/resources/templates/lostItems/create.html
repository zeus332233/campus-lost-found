<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>发布寻物启事</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f5f7fb; }
        .sidebar {
            min-height: 100vh;
            background: linear-gradient(180deg, #1a73e8 0%, #0d47a1 100%);
            color: white; padding-top: 1.5rem;
        }
        .sidebar h5 { color: rgba(255,255,255,0.85); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
        .sidebar .nav-link { color: rgba(255,255,255,0.75); border-radius: 8px; margin: 2px 8px; padding: 10px 16px; transition: all 0.2s; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: rgba(255,255,255,0.15); color: white; }
        .sidebar .nav-link i { width: 20px; text-align: center; }
        .main-content { padding: 0; background: #f5f7fb; }
        .topbar { background: white; padding: 12px 24px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); display: flex; align-items: center; justify-content: space-between; }
        .topbar .brand { font-size: 1.15rem; font-weight: 700; color: #1a73e8; }
        .content-area { padding: 24px; max-width: 800px; }
        .breadcrumb { margin-bottom: 16px; font-size: 0.85rem; }
        .form-card { background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); padding: 32px; }
    </style>
</head>
<body>
<div class="container-fluid p-0">
    <div class="row g-0">
        <div class="col-md-3 col-lg-2 sidebar">
            <div class="text-center mb-3">
                <i class="bi bi-mortarboard-fill fs-3"></i>
                <h5 class="mt-2 mb-0">校园失物招领</h5>
            </div>
            <hr style="border-color: rgba(255,255,255,0.2); margin: 12px 16px;">
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link" href="/dashboard"><i class="bi bi-grid-fill"></i> 首页总览</a></li>
                <li class="nav-item"><a class="nav-link" href="/found-items"><i class="bi bi-box-seam me-2"></i> 失物招领列表</a></li>
                <li class="nav-item"><a class="nav-link" href="/lost-items"><i class="bi bi-search me-2"></i> 寻物启事列表</a></li>
                <li class="nav-item"><a class="nav-link" href="/found-items/create"><i class="bi bi-plus-circle me-2"></i> 捡到物品发布</a></li>
                <li class="nav-item"><a class="nav-link active" href="/lost-items/create"><i class="bi bi-question-circle me-2"></i> 丢失物品发布</a></li>
                <li class="nav-item"><a class="nav-link" href="/notifications"><i class="bi bi-bell me-2"></i> 通知中心</a></li>
                <li class="nav-item"><a class="nav-link" href="/user/profile"><i class="bi bi-person me-2"></i> 个人中心</a></li>
            </ul>
        </div>

        <div class="col-md-9 col-lg-10 main-content">
            <div class="topbar">
                <div class="brand"><i class="bi bi-geo-alt-fill me-2"></i>智慧校园失物招领平台</div>
                <a href="/dashboard" class="btn btn-outline-secondary btn-sm"><i class="bi bi-house me-1"></i>返回首页</a>
            </div>
            <div class="content-area">
                <nav class="breadcrumb">
                    <a href="/dashboard" class="text-decoration-none text-muted">首页</a><span class="mx-2">/</span><span class="fw-bold">发布寻物启事</span>
                </nav>

                <div class="form-card">
                    <h4 class="mb-4"><i class="bi bi-question-circle text-danger me-2"></i>发布寻物启事信息</h4>
                    <form th:action="@{/lost-items}" method="post" class="needs-validation" novalidate enctype="multipart/form-data">
                        <div class="mb-3">
                            <label class="form-label fw-bold">标题</label>
                            <input type="text" name="title" class="form-control" required placeholder="请输入寻物启事标题">
                            <div class="invalid-feedback">请输入标题</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">描述</label>
                            <textarea name="description" class="form-control" rows="4" required placeholder="请详细描述物品特征"></textarea>
                            <div class="invalid-feedback">请输入描述</div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">类别</label>
                                <select name="category" class="form-select" required>
                                    <option value="">-- 请选择类别 --</option>
                                    <option value="电子设备">电子设备</option>
                                    <option value="随身物品">随身物品</option>
                                    <option value="证件文件">证件文件</option>
                                    <option value="其他">其他</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">丢失地点</label>
                                <input type="text" name="location" class="form-control" required placeholder="请输入丢失地点">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">丢失时间</label>
                            <input type="datetime-local" name="lostTime" class="form-control" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">联系电话</label>
                                <input type="tel" name="contactPhone" class="form-control" required placeholder="请输入联系电话">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">联系邮箱</label>
                                <input type="email" name="contactEmail" class="form-control" required placeholder="请输入联系邮箱">
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold">物品图片</label>
                            <input type="file" name="images" multiple class="form-control" accept="image/*">
                            <div class="form-text">可选择多张图片，支持jpg、png等格式</div>
                        </div>
                        <div class="d-flex gap-3 mt-4">
                            <button type="submit" class="btn btn-danger btn-lg"><i class="bi bi-check-circle me-2"></i>提交发布</button>
                            <a href="/dashboard" class="btn btn-outline-secondary btn-lg"><i class="bi bi-arrow-left me-2"></i>取消</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    (function () {
        'use strict';
        var forms = document.querySelectorAll('.needs-validation');
        Array.prototype.slice.call(forms).forEach(function (form) {
            form.addEventListener('submit', function (event) {
                if (!form.checkValidity()) { event.preventDefault(); event.stopPropagation(); }
                form.classList.add('was-validated');
            }, false);
        });
    })();
</script>
</body>
</html>
