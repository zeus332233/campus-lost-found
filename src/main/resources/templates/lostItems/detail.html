<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>寻物启事详情</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f5f7fb; }
        .content-container { max-width: 1000px; margin-top: 30px; }
        .breadcrumb { margin-bottom: 20px; font-size: 0.85rem; }
        .detail-card { background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        .detail-header { background: linear-gradient(135deg, #dc3545 0%, #b71c1c 100%); color: white; padding: 20px 28px; }
        .detail-body { display: flex; gap: 0; }
        .detail-image-area {
            width: 45%; min-height: 320px; background: #f0f2f5;
            display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden;
        }
        .detail-image-area img { width: 100%; height: 100%; object-fit: cover; }
        .detail-image-area .no-image { color: #adb5bd; text-align: center; }
        .detail-image-area .no-image i { font-size: 4rem; margin-bottom: 8px; }
        .detail-info-area { flex: 1; padding: 28px; }
        .detail-info-area .item { margin-bottom: 20px; }
        .detail-info-area .item .label { font-weight: 600; color: #495057; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
        .detail-info-area .item .value { color: #212529; font-size: 1rem; }
        .detail-info-area .item .value.desc { white-space: pre-line; line-height: 1.7; color: #495057; }
        .status-badge { padding: 6px 16px; border-radius: 20px; font-weight: 600; font-size: 0.85rem; }
        .action-bar { background: #f8f9fa; padding: 16px 28px; border-top: 1px solid #e9ecef; display: flex; gap: 10px; align-items: center; }

        .empty-state { text-align: center; padding: 60px; color: #adb5bd; }
        .empty-state i { font-size: 4rem; margin-bottom: 12px; }
    </style>
</head>
<body>
<div class="container content-container mx-auto">
    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-2"></i><span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <nav class="breadcrumb">
        <a href="/dashboard" class="text-decoration-none text-muted">首页</a><span class="mx-2">/</span>
        <a href="/lost-items" class="text-decoration-none text-muted">寻物启事列表</a><span class="mx-2">/</span>
        <span class="fw-bold text-truncate" style="max-width:300px;" th:text="${lostItem != null ? lostItem.title : '详情'}">详情</span>
    </nav>

    <div class="detail-card" th:if="${lostItem != null}">
        <div class="detail-header d-flex justify-content-between align-items-center">
            <h4 class="mb-0"><i class="bi bi-search me-2"></i><span th:text="${lostItem.title}"></span></h4>
            <th:block th:if="${isOwner}">
                <div class="d-flex gap-2">
                    <a th:href="@{/lost-items/{id}/edit(id=${lostItem.id})}" class="btn btn-light btn-sm"><i class="bi bi-pencil"></i> 编辑</a>
                    <form th:action="@{/lost-items/{id}/delete(id=${lostItem.id})}" method="post" style="display:inline"
                          onsubmit="return confirm('确定要删除这条寻物启事信息吗？此操作不可恢复。')">
                        <button type="submit" class="btn btn-outline-light btn-sm"><i class="bi bi-trash"></i> 删除</button>
                    </form>
                </div>
            </th:block>
        </div>

        <div class="detail-body">
            <div class="detail-image-area">
                <th:block th:if="${lostItem.imageUrls != null and !lostItem.imageUrls.isEmpty()}">
                    <img th:src="${lostItem.imageUrls.split(',')[0]}" alt="物品图片">
                </th:block>
                <div class="no-image" th:unless="${lostItem.imageUrls != null and !lostItem.imageUrls.isEmpty()}">
                    <i class="bi bi-image"></i><p class="text-muted">暂无物品图片</p>
                </div>
            </div>

            <div class="detail-info-area">
                <div class="item">
                    <div class="label">物品类别</div>
                    <div class="value">
                        <span class="badge-category" style="background:#fdecea;color:#dc3545;padding:4px 12px;border-radius:20px;"
                              th:text="${lostItem.category}"></span>
                    </div>
                </div>
                <div class="item">
                    <div class="label">当前状态</div>
                    <div class="value">
                        <span class="status-badge" style="background:#fff3e0;color:#e65100;" th:if="${lostItem.status == 'SEARCHING'}"><i class="bi bi-search me-1"></i>寻找中</span>
                        <span class="status-badge" style="background:#e3f2fd;color:#1565c0;" th:if="${lostItem.status == 'CLAIM_PENDING'}"><i class="bi bi-hourglass-split me-1"></i>待认领审核</span>
                        <span class="status-badge" style="background:#e8f5e9;color:#2e7d32;" th:if="${lostItem.status == 'CLAIMED'}"><i class="bi bi-check-circle me-1"></i>已认领</span>
                        <span class="status-badge" style="background:#e8f5e9;color:#2e7d32;" th:if="${lostItem.status == 'FOUND'}"><i class="bi bi-emoji-smile me-1"></i>已找到</span>
                    </div>
                </div>
                <div class="item">
                    <div class="label">丢失地点</div>
                    <div class="value"><i class="bi bi-geo-alt text-danger me-1"></i><span th:text="${lostItem.location != null ? lostItem.location : '未填写'}"></span></div>
                </div>
                <div class="item">
                    <div class="label">丢失时间</div>
                    <div class="value"><i class="bi bi-calendar3 text-danger me-1"></i><span th:text="${lostItem.lostTime != null ? dateUtils.formatTimestamp(lostItem.lostTime) : '未知'}"></span></div>
                </div>
                <div class="item">
                    <div class="label">发布时间</div>
                    <div class="value text-muted small"><span th:text="${lostItem.createdAt != null ? dateUtils.formatTimestamp(lostItem.createdAt) : '未知'}"></span></div>
                </div>
                <div class="item">
                    <div class="label">物品描述</div>
                    <div class="value desc" th:text="${lostItem.description != null ? lostItem.description : '暂无描述'}"></div>
                </div>
                <div class="item">
                    <div class="label">联系方式</div>
                    <div class="value"><i class="bi bi-telephone me-1"></i><span th:text="${lostItem.contactPhone}"></span></div>
                    <div class="value mt-1"><i class="bi bi-envelope me-1"></i><span th:text="${lostItem.contactEmail}"></span></div>
                </div>
            </div>
        </div>

        <div class="action-bar" th:if="${lostItem.status == 'SEARCHING' and not isOwner}">
            <a th:href="@{/claims/create(itemId=${lostItem.id}, itemType='LOST')}" class="btn btn-danger">
                <i class="bi bi-hand-thumbs-up me-1"></i> 我找到了该物品
            </a>
        </div>
    </div>

    <div th:if="${lostItem == null}" class="empty-state">
        <i class="bi bi-exclamation-circle"></i><h5>未找到该寻物启事信息</h5>
    </div>

    <div class="d-flex justify-content-center gap-3 mt-4 pb-5">
        <a th:if="${param.from != null and param.from[0] == 'profile'}" href="/user/profile"
           class="btn btn-outline-primary"><i class="bi bi-arrow-left me-2"></i>返回个人中心</a>
        <a th:unless="${param.from != null and param.from[0] == 'profile'}" href="/lost-items"
           class="btn btn-outline-primary"><i class="bi bi-arrow-left me-2"></i>返回列表</a>
        <a href="/dashboard" class="btn btn-outline-secondary"><i class="bi bi-house me-2"></i>返回首页</a>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
